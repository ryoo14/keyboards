# rhyn47 左手 = ペリフェラル（キーのみ・トラックボールなし）

# --- ブリングアップ用ログ（設計書 §13）。安定したら切ってよい ---
CONFIG_ZMK_USB_LOGGING=y

# --- ポインティング ---
# ペリフェラルは keymap.c 自体がビルドされない（ZMK の app/CMakeLists.txt で
# `(NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL` に閉じ込められている）ため、
# 左右共通キーマップに &mkp が入っていても左では ZMK_POINTING は不要（実装ノート §10 のとおり）。
# PMW3610 系の CONFIG も当然入れない＝センサー用のクロックも通信も出ない。

# --- 省電力（設計書 §5・実装ノート §9）---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- 電池 ---
CONFIG_ZMK_BATTERY_REPORTING=y
