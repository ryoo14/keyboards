# rhyn47 右手 = セントラル（PC と BLE 接続する親）＋ トラックボール

# --- ブリングアップ用ログ（設計書 §13）。安定したら切ってよい ---
CONFIG_ZMK_USB_LOGGING=y

# --- ポインティング / PMW3610 ---
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
# ⚠ CONFIG 名は採用フォーク（badjeff/zmk-pmw3610-driver）の README と要照合。
#    west.yml / rhyn47_right.overlay の compatible と3点セットで揃える。
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# --- 省電力（設計書 §5・実装ノート §9）---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- 電池 ---
# ⚠ ZMK の残量%曲線は Li 系(3.0-4.2V)前提。本機は NiMH 単4×1 (1.0-1.4V) なので
#    そのままだと常時 0% 近辺を報告する。第1段階は「電圧が読めること」だけ確認すれば十分。
CONFIG_ZMK_BATTERY_REPORTING=y
